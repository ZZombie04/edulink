name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/edulink_ci
      EDULINK_ENABLE_DEMO_SEED: "true"
      EDULINK_SESSION_SECRET: ci-only-edulink-session-secret-with-at-least-48-characters
      NEXT_TELEMETRY_DISABLED: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edulink_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edulink_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Verify database migration state
        run: |
          npx prisma migrate status
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build production application
        run: npm run build

      - name: Run live API workflows
        env:
          EDULINK_VERIFY_BASE_URL: http://127.0.0.1:3208
        shell: bash
        run: |
          set -euo pipefail

          server_log="${RUNNER_TEMP}/edulink-live-server.log"
          npm run dev -- --hostname 127.0.0.1 --port 3208 \
            >"${server_log}" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          server_ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              "${EDULINK_VERIFY_BASE_URL}/api/hiring/state" \
              >/dev/null; then
              server_ready=1
              break
            fi

            if ! kill -0 "${server_pid}" 2>/dev/null; then
              echo "Development server exited before becoming ready."
              cat "${server_log}"
              exit 1
            fi

            sleep 1
          done

          if [[ "${server_ready}" -ne 1 ]]; then
            echo "Development server did not become ready within 60 seconds."
            cat "${server_log}"
            exit 1
          fi

          if ! npm run test:live; then
            echo "Live workflow failed. Development server log:"
            cat "${server_log}"
            exit 1
          fi
